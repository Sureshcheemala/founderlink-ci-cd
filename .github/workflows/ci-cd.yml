name: FounderLink CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      API_GATEWAY_PORT: ${{ secrets.API_GATEWAY_PORT }}
      CONFIG_PORT: ${{ secrets.CONFIG_PORT }}
      EUREKA_PORT: ${{ secrets.EUREKA_PORT }}
      MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 🔥 Build each service
    - name: Build Config Server
      run: cd founderlink-config-server && mvn clean package -DskipTests

    - name: Build Service Registry
      run: cd founderlink-service-registry && mvn clean package -DskipTests

    - name: Build Auth Service
      run: cd founderlink-auth-service && mvn clean package -DskipTests

    - name: Build User Service
      run: cd founderlink-user-service && mvn clean package -DskipTests

    - name: Build Team Service
      run: cd founderlink-team-service && mvn clean package -DskipTests

    - name: Build Startup Service
      run: cd founderlink-startup-service && mvn clean package -DskipTests

    - name: Build Investment Service
      run: cd founderlink-investment-service && mvn clean package -DskipTests

    - name: Build Notification Service
      run: cd founderlink-notification-service && mvn clean package -DskipTests

    - name: Build API Gateway
      run: cd founderlink-api-gateway && mvn clean package -DskipTests

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    # 🔐 Login to DockerHub
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 🐳 Build & Push Images
    - name: Build and Push Images
      run: |
        docker compose build

        docker tag founderlink-auth-service ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:latest

        docker tag founderlink-user-service ${{ secrets.DOCKER_USERNAME }}/user-service:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/user-service:latest

        docker tag founderlink-api-gateway ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest