name: Frontend CI/CD

on:
  push:
    paths:
      - "founderlink-frontend/**"

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # 🧱 CI
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push Frontend
      run: |
        docker build -t $DOCKER_USERNAME/frontend:latest ./founderlink-frontend
        docker build -t $DOCKER_USERNAME/frontend:$IMAGE_TAG ./founderlink-frontend

        docker push $DOCKER_USERNAME/frontend:latest
        docker push $DOCKER_USERNAME/frontend:$IMAGE_TAG


  # 🚀 CD
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Deploy Frontend
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          cd ~/founderlink-ci-cd
          docker compose pull frontend
          docker compose up -d frontend