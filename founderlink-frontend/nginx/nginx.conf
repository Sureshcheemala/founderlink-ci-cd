server {
    listen 80;

    resolver 127.0.0.11;

    # API routing
    location /api {
        proxy_pass http://api-gateway:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}