server {
    listen 80;

    # 🔥 DO NOT resolve at startup
    set $backend "http://api-gateway:8085";

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}